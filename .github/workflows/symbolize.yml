name: Symbolize crash
on:
  push:
    branches: [debug/symbolize]
jobs:
  symbolize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PDB
          path: pdb
          run-id: 43806024122
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: OrcaSlicer_Windows_V1.1.0-dev_x64_portable
          path: app
          run-id: 43806024122
          github-token: ${{ github.token }}
      - name: Symbolize
        shell: pwsh
        run: |
          Get-ChildItem -Recurse pdb | ForEach-Object { "$($_.FullName) $($_.Length)" }
          Get-ChildItem -Recurse pdb -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath pdb\x -Force }
          Get-ChildItem -Recurse pdb -Filter *.7z | ForEach-Object { 7z x $_.FullName -opdb\x -y | Out-Null }
          Get-ChildItem -Recurse pdb -Filter *.pdb | ForEach-Object { "$($_.FullName) $($_.Length)" }
          $dll = (Get-ChildItem -Recurse app -Filter OrcaSlicer.dll | Select-Object -First 1).FullName
          $pdb = (Get-ChildItem -Recurse pdb -Filter *.pdb | Where-Object { $_.Name -like 'OrcaSlicer*' -and $_.Name -notlike '*exe*' } | Sort-Object Length -Descending | Select-Object -First 1).FullName
          Write-Host "PDB: $pdb"
          Copy-Item $pdb (Join-Path (Split-Path $dll) "OrcaSlicer.pdb")
          $llvm = "C:\Program Files\LLVM\bin"
          & "$llvm\llvm-objdump.exe" -h $dll | Select-Object -First 12
          $text = & "$llvm\llvm-objdump.exe" -h $dll | Select-String '\.text' | Select-Object -First 1
          Write-Host "TEXT: $text"
          $parts = ($text.ToString().Trim() -split '\s+')
          $va = [Convert]::ToInt64($parts[3], 16)
          $base = [Convert]::ToInt64((& "$llvm\llvm-objdump.exe" -p $dll | Select-String 'ImageBase' | Select-Object -First 1).ToString().Trim().Split()[-1], 16)
          Write-Host "VA=$va BASE=$base"
          foreach ($o in (Get-Content offsets.txt).Trim().Split(' ')) {
            $addr = '0x{0:X}' -f ($va + [Convert]::ToInt64($o.Substring(2), 16))
            Write-Host "=== $o -> $addr"
            & "$llvm\llvm-symbolizer.exe" --obj=$dll --inlining --functions=linkage --demangle $addr
          }
